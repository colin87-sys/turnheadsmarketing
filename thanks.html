<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks — Turn Heads Marketing</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#13233F;--orange:#FF4D00;--paper:#F2F1EC;--muted:#5B6678}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--navy);font-family:Barlow,system-ui,sans-serif;padding:24px;
  border-top:10px solid;border-image:repeating-linear-gradient(-45deg,var(--orange) 0 14px,var(--navy) 14px 28px) 10}
.card{max-width:560px;text-align:center}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(2.4rem,7vw,3.6rem);letter-spacing:.02em;line-height:1}
h1 span{color:var(--orange)}
p{margin-top:18px;font-size:1.1rem;line-height:1.6;color:var(--muted)}
a.btn{display:inline-block;margin-top:30px;background:var(--orange);color:#fff;text-decoration:none;font-weight:600;padding:.9em 1.8em;border-radius:10px}
a.btn:hover{background:var(--navy)}
</style>
</head>
<body>
<div class="card">
  <h1>Got it. <span>We'll be quick.</span></h1>
  <p>Your demo request is in. We'll text or email you within one business day to lock in a time — usually much sooner.</p>
  <p>In the meantime, think about your two numbers: how many calls you miss a week, and what one job is worth.</p>
  <a class="btn" href="/">Back to the site</a>
</div>
</body>
</html>
