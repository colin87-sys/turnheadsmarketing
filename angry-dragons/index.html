<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dragon Drift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1c2e5e; overscroll-behavior: none; }
    body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    canvas { display: block; touch-action: none; }

    #hud { position: fixed; inset: 0; pointer-events: none; color: #eaf4ff; }

    /* --- bars --- */
    .hud-top-left { position: absolute; top: 20px; left: 20px; width: 230px; }
    .bar-label { font-size: 11px; letter-spacing: 2px; opacity: 0.85; margin: 6px 0 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .bar { height: 12px; background: rgba(8, 18, 38, 0.6); border: 1px solid rgba(160, 210, 255, 0.35); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; transition: width 0.12s linear; }
    .bar-fill.health  { background: linear-gradient(90deg, #ff5a5a, #ff9a5a); width: 100%; }
    .bar-fill.stamina { background: linear-gradient(90deg, #3fb6ff, #7fe0ff); width: 100%; }
    .bar-fill.stamina.depleted { background: #58606e; }
    .hint { font-size: 11px; opacity: 0.6; margin-top: 8px; letter-spacing: 1px; }

    /* --- score / combo --- */
    .hud-top-right { position: absolute; top: 20px; right: 60px; text-align: right; }
    .score { font-size: 40px; font-weight: 700; text-shadow: 0 0 18px rgba(80, 190, 255, 0.8), 0 2px 4px rgba(0,0,0,0.5); transition: transform 0.08s; }
    .score.boost-pulse { animation: score-pulse 0.18s ease-out; }
    @keyframes score-pulse { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
    .combo { font-size: 14px; letter-spacing: 2px; opacity: 0.8; transition: color 0.3s; }
    .combo.hot   { color: #ffd86a; opacity: 1; text-shadow: 0 0 12px rgba(255,200,90,0.8); }
    .combo.fever { color: #ff88ff; opacity: 1; text-shadow: 0 0 16px rgba(255,120,255,0.9); animation: pulse 0.6s ease-in-out infinite; }
    .dist { font-size: 13px; letter-spacing: 2px; opacity: 0.75; margin-top: 3px; }
    .best { font-size: 11px; letter-spacing: 2px; opacity: 0.6; margin-top: 4px; }

    /* --- music / sfx mute buttons --- */
    .audio-btns {
      position: absolute; top: 20px; right: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .mute-btn {
      pointer-events: auto; cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #aad4f0; background: rgba(20, 40, 80, 0.55);
      border: 1px solid rgba(140, 210, 255, 0.4);
    }
    .mute-btn:hover { background: rgba(60, 120, 200, 0.5); }
    .mute-btn.off { color: #5a7a96; opacity: 0.7; }

    /* --- popups --- */
    .popup  { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 700; letter-spacing: 2px; opacity: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .popup2 { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; letter-spacing: 2px; opacity: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .popup[data-color="cyan"]   { color: #7fe0ff; }
    .popup[data-color="green"]  { color: #58ffa0; }
    .popup[data-color="gold"]   { color: #ffd86a; }
    .popup[data-color="red"]    { color: #ff7a7a; }
    .popup[data-color="fever"]  { color: #ff88ff; font-size: 38px; text-shadow: 0 0 24px rgba(255,100,255,0.9); }
    .popup2[data-color="orange"]{ color: #ffbb55; }
    .popup.popup-anim  { animation: popup 0.9s ease-out forwards; }
    .popup2.popup2-anim{ animation: popup2 1.1s ease-out forwards; }
    @keyframes popup  { 0%{opacity:0;transform:translate(-50%,12px) scale(0.8)} 15%{opacity:1;transform:translate(-50%,0) scale(1.1)} 70%{opacity:1;transform:translate(-50%,-18px) scale(1)} 100%{opacity:0;transform:translate(-50%,-34px) scale(1)} }
    @keyframes popup2 { 0%{opacity:0;transform:translate(-50%,8px) scale(0.85)} 12%{opacity:1;transform:translate(-50%,0) scale(1.05)} 75%{opacity:0.9;transform:translate(-50%,-12px)} 100%{opacity:0;transform:translate(-50%,-26px)} }

    /* --- damage / orb flash --- */
    .vignette  { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,40,40,0.55) 100%); }
    .blue-flash{ position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(110,200,255,0.22) 0%, transparent 70%); }
    .flash-anim{ animation: flash 0.45s ease-out forwards; }
    @keyframes flash { 0%{opacity:1} 100%{opacity:0} }

    /* --- fever / dragon surge overlay --- */
    .fever-overlay { position: absolute; inset: 0; opacity: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(200,80,255,0.12) 100%);
      transition: opacity 0.4s; }
    .fever-overlay.active { opacity: 1; animation: fever-pulse 0.8s ease-in-out infinite; }
    @keyframes fever-pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

    /* --- full screens --- */
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; background: rgba(10,16,34,0.55); backdrop-filter: blur(3px); overflow-y: auto; padding: 20px 0; }
    .screen.visible { display: flex; pointer-events: auto; }
    .screen h1 { font-size: 52px; letter-spacing: 8px; margin-bottom: 18px;
      text-shadow: 0 0 24px rgba(80,190,255,0.9), 0 2px 6px rgba(0,0,0,0.6); }
    .screen h1.bad  { color: #ff8a7a; text-shadow: 0 0 24px rgba(255,90,70,0.7); }
    .screen .sub    { font-size: 17px; opacity: 0.9; margin: 4px 0; }
    .screen .sub.big{ font-size: 26px; font-weight: 700; margin: 8px 0; }
    .screen ul      { list-style: none; margin: 16px 0; font-size: 15px; line-height: 2; opacity: 0.9; }
    .screen .c  { color: #7fe0ff; }
    .screen .cg { color: #58ffa0; }
    .screen .cf { color: #ff88ff; }
    .screen .action  { margin-top: 26px; font-size: 18px; letter-spacing: 3px; color: #ffd86a; animation: pulse 1.6s ease-in-out infinite; }
    .screen .action-key { margin-top: 12px; font-size: 13px; letter-spacing: 2px; opacity: 0.5; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .newbest   { color: #ffd86a; font-size: 20px; letter-spacing: 4px; margin-bottom: 10px;
      text-shadow: 0 0 16px rgba(255,200,90,0.9); animation: pulse 1.2s ease-in-out infinite; }
    .challenge     { color: #ff9a5a; font-size: 16px; letter-spacing: 2px; margin: 6px 0 10px; }
    .challenge.won { color: #8aff9a; text-shadow: 0 0 14px rgba(110,255,140,0.7); }
    .sub.gap       { color: #ffd86a; }

    /* --- run stats grid --- */
    .run-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 16px; margin: 18px 0 8px; max-width: 480px; width: 90%; }
    .stat { display: flex; flex-direction: column; align-items: center; background: rgba(30,55,100,0.4); border: 1px solid rgba(100,180,255,0.2); border-radius: 8px; padding: 8px 4px; }
    .stat-val { font-size: 18px; font-weight: 700; color: #aee8ff; }
    .stat-lbl { font-size: 10px; letter-spacing: 1.5px; opacity: 0.65; margin-top: 2px; text-transform: uppercase; }

    /* --- buttons --- */
    .action-row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
    .btn-primary   { pointer-events: auto; cursor: pointer; font-family: inherit; font-weight: 700;
      font-size: 15px; letter-spacing: 2px; color: #1a1206; padding: 12px 28px; border: none;
      border-radius: 10px; background: linear-gradient(90deg, #ffd86a, #ffb763); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 13px;
      letter-spacing: 1.5px; color: #dff2ff; padding: 12px 20px; border-radius: 10px;
      background: rgba(60,150,220,0.25); border: 1px solid rgba(140,210,255,0.6); }
    .btn-secondary:hover { background: rgba(80,180,255,0.45); }
    .share-menu { display: flex; gap: 14px; margin-top: 14px; }
    .share-menu[hidden] { display: none; }
    .share-menu button { pointer-events: auto; cursor: pointer; width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #dff2ff;
      background: rgba(60,150,220,0.25); border: 1px solid rgba(140,210,255,0.6); }
    .share-menu button:hover { background: rgba(80,180,255,0.45); }
    .share-hint { font-size: 12px; color: #9fd8f0; margin-top: 10px; min-height: 16px; padding: 0 16px; }

    /* --- compact mobile HUD --- */
    @media (max-width: 700px) {
      .hud-top-left  { top: 10px; left: 10px; width: 140px; }
      .bar           { height: 9px; }
      .bar-label     { font-size: 9px; letter-spacing: 1.5px; margin: 4px 0 2px; }
      .hint          { display: none; }
      .hud-top-right { top: 10px; right: 52px; }
      .score         { font-size: 26px; }
      .combo         { font-size: 11px; letter-spacing: 1.5px; }
      .dist          { font-size: 10px; }
      .best          { font-size: 9px; }
      .popup         { font-size: 20px; top: 24%; }
      .popup2        { font-size: 16px; top: 32%; }
      .audio-btns    { top: 14px; right: 12px; gap: 6px; }
      .mute-btn      { width: 32px; height: 32px; }
      .screen h1     { font-size: 34px; letter-spacing: 4px; padding: 0 10px; }
      .screen .sub   { font-size: 14px; padding: 0 16px; }
      .screen .sub.big{ font-size: 20px; }
      .screen ul     { font-size: 12.5px; line-height: 1.9; padding: 0 18px; }
      .run-stats     { grid-template-columns: repeat(4, 1fr); gap: 6px 8px; }
      .stat-val      { font-size: 14px; }
      .stat-lbl      { font-size: 8.5px; }
      .action-row    { gap: 8px; margin-top: 14px; }
      .btn-primary   { font-size: 14px; padding: 11px 22px; }
      .btn-secondary { font-size: 11px; padding: 11px 14px; }
      .newbest       { font-size: 15px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
