<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Angry Dragons</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1c2e5e; overscroll-behavior: none; }
    body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    canvas { display: block; touch-action: none; } /* drag = steering, not scrolling */

    #hud { position: fixed; inset: 0; pointer-events: none; color: #eaf4ff; }

    /* --- bars --- */
    .hud-top-left { position: absolute; top: 20px; left: 20px; width: 230px; }
    .bar-label { font-size: 11px; letter-spacing: 2px; opacity: 0.85; margin: 6px 0 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .bar { height: 12px; background: rgba(8, 18, 38, 0.6); border: 1px solid rgba(160, 210, 255, 0.35); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; transition: width 0.12s linear; }
    .bar-fill.health { background: linear-gradient(90deg, #ff5a5a, #ff9a5a); width: 100%; }
    .bar-fill.stamina { background: linear-gradient(90deg, #3fb6ff, #7fe0ff); width: 100%; }
    .bar-fill.stamina.depleted { background: #58606e; }
    .hint { font-size: 11px; opacity: 0.6; margin-top: 8px; letter-spacing: 1px; }

    /* --- score --- */
    .hud-top-right { position: absolute; top: 20px; right: 24px; text-align: right; }
    .score { font-size: 40px; font-weight: 700; text-shadow: 0 0 18px rgba(80, 190, 255, 0.8), 0 2px 4px rgba(0,0,0,0.5); }
    .combo { font-size: 14px; letter-spacing: 2px; opacity: 0.8; }
    .combo.hot { color: #ffd86a; opacity: 1; text-shadow: 0 0 12px rgba(255, 200, 90, 0.8); }
    .dist { font-size: 13px; letter-spacing: 2px; opacity: 0.75; margin-top: 3px; }
    .best { font-size: 11px; letter-spacing: 2px; opacity: 0.6; margin-top: 4px; }

    /* --- progress (legacy, kept for safety) --- */
    .hud-progress { display: none; }

    /* --- popups --- */
    .popup { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 700;
      letter-spacing: 2px; opacity: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    .popup[data-color="cyan"] { color: #7fe0ff; }
    .popup[data-color="green"] { color: #58ffa0; }
    .popup[data-color="gold"] { color: #ffd86a; }
    .popup[data-color="red"] { color: #ff7a7a; }
    .popup.popup-anim { animation: popup 0.9s ease-out forwards; }
    @keyframes popup {
      0% { opacity: 0; transform: translate(-50%, 12px) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
      70% { opacity: 1; transform: translate(-50%, -18px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
    }

    /* --- damage vignette / orb flash --- */
    .vignette { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 40, 40, 0.55) 100%); }
    .blue-flash { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(110, 200, 255, 0.22) 0%, transparent 70%); }
    .flash-anim { animation: flash 0.45s ease-out forwards; }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* --- full screens (start / game over / finish) --- */
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; background: rgba(10, 16, 34, 0.55); backdrop-filter: blur(3px); }
    .screen.visible { display: flex; pointer-events: auto; }
    .screen h1 { font-size: 52px; letter-spacing: 8px; margin-bottom: 18px;
      text-shadow: 0 0 24px rgba(80, 190, 255, 0.9), 0 2px 6px rgba(0,0,0,0.6); }
    .screen h1.bad { color: #ff8a7a; text-shadow: 0 0 24px rgba(255, 90, 70, 0.7); }
    .screen h1.good { color: #9fe8ff; }
    .screen .sub { font-size: 17px; opacity: 0.9; margin: 4px 0; }
    .screen ul { list-style: none; margin: 18px 0; font-size: 15px; line-height: 2; opacity: 0.9; }
    .screen .c { color: #7fe0ff; }
    .screen .cg { color: #58ffa0; }
    .screen .action { margin-top: 26px; font-size: 18px; letter-spacing: 3px; color: #ffd86a; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .newbest { color: #ffd86a; font-size: 20px; letter-spacing: 4px; margin-bottom: 10px;
      text-shadow: 0 0 16px rgba(255, 200, 90, 0.9); animation: pulse 1.2s ease-in-out infinite; }
    .challenge { color: #ff9a5a; font-size: 16px; letter-spacing: 2px; margin: 6px 0 10px; }
    .challenge.won { color: #8aff9a; text-shadow: 0 0 14px rgba(110, 255, 140, 0.7); }
    .share-row { display: flex; gap: 10px; margin-top: 22px; }
    .share-row button { pointer-events: auto; cursor: pointer; font-family: inherit; font-size: 12px;
      letter-spacing: 1.5px; color: #dff2ff; padding: 10px 16px; border-radius: 8px;
      background: rgba(60, 150, 220, 0.25); border: 1px solid rgba(140, 210, 255, 0.6); }
    .share-row button:hover { background: rgba(80, 180, 255, 0.45); }
    .share-menu { display: flex; gap: 14px; margin-top: 14px; }
    .share-menu[hidden] { display: none; }
    .share-menu button { pointer-events: auto; cursor: pointer; width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #dff2ff;
      background: rgba(60, 150, 220, 0.25); border: 1px solid rgba(140, 210, 255, 0.6); }
    .share-menu button:hover { background: rgba(80, 180, 255, 0.45); }
    .share-hint { font-size: 12px; color: #9fd8f0; margin-top: 10px; min-height: 16px; padding: 0 16px; }
    .sub.big { font-size: 22px; }
    .sub.gap { color: #ffd86a; }
    .btn-primary { pointer-events: auto; cursor: pointer; font-family: inherit; font-weight: 700;
      font-size: 15px; letter-spacing: 2px; color: #1a1206; padding: 12px 28px; border: none;
      border-radius: 10px; margin-top: 20px; background: linear-gradient(90deg, #ffd86a, #ffb763); }
    .btn-primary:hover { filter: brightness(1.08); }

    /* --- compact mobile HUD --- */
    @media (max-width: 700px) {
      .hud-top-left { top: 10px; left: 10px; width: 140px; }
      .bar { height: 9px; }
      .bar-label { font-size: 9px; letter-spacing: 1.5px; margin: 4px 0 2px; }
      .hint { display: none; }
      .hud-top-right { top: 10px; right: 12px; }
      .score { font-size: 26px; }
      .combo { font-size: 11px; letter-spacing: 1.5px; }
      .dist { font-size: 10px; }
      .best { font-size: 9px; }
      .popup { font-size: 20px; top: 24%; }
      .screen h1 { font-size: 34px; letter-spacing: 4px; padding: 0 10px; }
      .screen .sub { font-size: 14px; padding: 0 16px; }
      .screen .sub.big { font-size: 18px; }
      .screen ul { font-size: 12.5px; line-height: 1.9; padding: 0 18px; }
      .screen .action { font-size: 14px; letter-spacing: 2px; }
      .newbest { font-size: 16px; }
      .challenge { font-size: 13px; }
      .share-row { flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; }
      .share-row button { font-size: 11px; padding: 9px 12px; }
      .btn-primary { font-size: 14px; padding: 11px 24px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
